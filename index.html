<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4038d8"><title>LamTH Chemistry | Student Attendance</title>
<style>
:root{--p:#4038d8;--pd:#3028ae;--ink:#202441;--muted:#69718a;--line:#e4e7f0;--bg:#f5f6fc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at top right,#e8e7ff 0,transparent 34%),var(--bg);min-height:100vh}.wrap{width:min(100% - 28px,700px);margin:auto;padding:28px 0 40px}header{display:flex;gap:13px;align-items:center;margin-bottom:22px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;color:#fff;background:linear-gradient(145deg,#5c55ee,#3028ae);font-size:25px;font-weight:800}h1{font-size:clamp(1.45rem,4vw,2rem);margin:0 0 4px}.sub{margin:0;color:var(--muted);font-size:.94rem}.pill{display:inline-flex;gap:7px;align-items:center;background:#eeedff;color:var(--pd);padding:7px 11px;border-radius:30px;font-size:.8rem;font-weight:700;margin-bottom:14px}.dot{width:7px;height:7px;background:#675df1;border-radius:50%}.card{background:white;border:1px solid var(--line);border-radius:21px;box-shadow:0 16px 44px #2025520c;overflow:hidden}.head{padding:22px 23px 17px;border-bottom:1px solid var(--line)}h2{font-size:1.2rem;margin:0 0 7px}.head p{margin:0;color:var(--muted);line-height:1.5;font-size:.92rem}form{padding:22px 23px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.full{grid-column:1/-1}label{font-size:.88rem;font-weight:700}input,select{height:48px;width:100%;padding:0 12px;border:1px solid #d6dbea;border-radius:11px;font:inherit;color:var(--ink);background:#fff}.hint{font-size:.78rem;color:var(--muted);line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt input{position:absolute;opacity:0;width:1px;height:1px}.opt label{display:flex;align-items:center;justify-content:center;height:49px;border:1px solid #d6dbea;border-radius:12px;cursor:pointer;color:#555d75}.opt input:checked+label{border-color:var(--p);background:#f0efff;color:var(--pd);box-shadow:inset 0 0 0 1px var(--p)}button{font:inherit;cursor:pointer}.submit{height:51px;width:100%;margin-top:22px;border:0;border-radius:12px;background:var(--p);color:#fff;font-weight:800}.submit:disabled{opacity:.6;cursor:wait}.msg{display:none;margin:0 23px 22px;padding:13px 15px;border-radius:12px;line-height:1.45;font-size:.9rem}.msg.show{display:block}.success{color:#12613d;background:#eaf8f0;border:1px solid #b9e7cb}.error{color:#8c2018;background:#fff0ef;border:1px solid #ffd0cc}.info{color:#343b60;background:#f0f2ff;border:1px solid #d9ddff}footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px;line-height:1.6}footer a{color:var(--p)}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head,form{padding-left:17px;padding-right:17px}.msg{margin-left:17px;margin-right:17px}}
</style></head><body><main class="wrap">
<header><div class="logo">L</div><div><h1>LamTH Chemistry</h1><p class="sub">Student Attendance Portal</p></div></header><div class="pill"><span class="dot"></span> Student portal</div>
<section class="card"><div class="head"><h2>Submit your attendance</h2><p>Enter your details and the session PIN provided by your tutor.</p></div>
<form id="attendance-form"><div class="grid">
<div class="field full"><label for="className">Class</label><select id="className" required><option value="">Loading classes…</option></select><span class="hint" id="class-hint">Connecting to attendance service.</span></div>
<div class="field"><label for="studentName">Student name</label><input id="studentName" required maxlength="100" autocomplete="name" placeholder="Your full name"></div>
<div class="field"><label for="studentId">Student ID</label><input id="studentId" required maxlength="50" autocomplete="off" placeholder="Your student ID"></div>
<div class="field full"><label for="pin">Six-digit session PIN</label><input id="pin" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="••••••" autocomplete="off"><span class="hint">Ask your tutor for today's session PIN.</span></div>
<div class="field full"><label>Attendance status</label><div class="options"><div class="opt"><input type="radio" id="present" name="status" value="present" required><label for="present">Present</label></div><div class="opt"><input type="radio" id="absent" name="status" value="absent" required><label for="absent">Absent</label></div></div></div>
</div><button class="submit" id="submit-btn" type="submit">Submit Attendance</button></form><div id="message" class="msg" role="status" aria-live="polite"></div></section>
<footer><div>LamTH Chemistry · Tuition Attendance</div><div><a href="teacher.html">Teacher dashboard</a></div></footer></main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyIa-njt_kbXWFrxSxTebempiuFNOXLryBvvgKIFcee73Ozw12YiOh34Y6ZabXdREK7/exec";
const form=document.getElementById("attendance-form"),sel=document.getElementById("className"),hint=document.getElementById("class-hint"),btn=document.getElementById("submit-btn"),msg=document.getElementById("message");
function show(t,c){msg.textContent=t;msg.className="msg show "+c}
function jsonp(url){return new Promise((resolve,reject)=>{const cb="lamthCallback_"+Math.random().toString(36).slice(2);const s=document.createElement("script");const timer=setTimeout(()=>{clean();reject(new Error("Service timed out."))},12000);function clean(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error("Could not connect to Apps Script."))};s.src=url+(url.includes("?")?"&":"?")+"callback="+encodeURIComponent(cb);document.head.appendChild(s)})}
async function load(){try{const d=await jsonp(API_URL+"?action=classes");if(!d||d.success!==true||!Array.isArray(d.classes))throw Error(d?.message||"Invalid class response");sel.innerHTML="";sel.add(new Option("Select your class",""));d.classes.forEach(c=>sel.add(new Option(c,c)));hint.textContent=d.classes.length?"Choose the class for this session.":"No active classes found; check the Students sheet."}catch(e){sel.innerHTML='<option value="">Unable to load classes</option>';hint.textContent="Check Apps Script deployment and refresh.";show("Could not load classes: "+e.message,"error")}}
async function post(v){return fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams(v).toString()})}
async function check(id){for(let i=0;i<6;i++){const d=await jsonp(API_URL+"?action=check&requestId="+encodeURIComponent(id));if(d&&d.success&&d.recorded)return d;await new Promise(r=>setTimeout(r,1200))}return null}
form.addEventListener("submit",async e=>{e.preventDefault();if(!form.reportValidity())return;const id="web-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);const v={action:"submit",requestId:id,studentName:document.getElementById("studentName").value.trim(),studentId:document.getElementById("studentId").value.trim(),className:sel.value,pin:document.getElementById("pin").value.trim(),status:form.elements.status.value};if(!v.className){show("Please select a class.","error");return}btn.disabled=true;btn.textContent="Submitting…";show("Submitting attendance. Please wait…","info");try{await post(v);const d=await check(id);if(d){show("Attendance recorded successfully: "+d.status+".","success");form.reset();sel.selectedIndex=0}else show("Attendance could not be confirmed. Please check with your tutor before submitting again.","error")}catch(err){show("Could not confirm submission. Please contact your tutor before retrying.","error")}finally{btn.disabled=false;btn.textContent="Submit Attendance"}});
load();
</script></body></html>
