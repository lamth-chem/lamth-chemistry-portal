
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LamTH Chemistry | Teacher Portal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f0ff;
      font-family: Arial, sans-serif;
      color: #282044;
    }
    main {
      width: min(380px, calc(100% - 48px));
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #29204b18;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: 0;
      border-radius: 9px;
      background: #6842d8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #message { margin-top: 18px; overflow-wrap: anywhere; }
    .muted { color: #716b80; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>LamTH Chemistry</h1>
    <p>Teacher Dashboard</p>
    <p class="muted">Sign in using your authorised teacher Google account.</p>
    <button id="signIn">Sign in with Google</button>
    <button id="signOut" hidden>Sign out</button>
    <div id="message" role="status">Ready to sign in.</div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABbBnV-BV1B6QqDCp2VJ3fJopp7STefzM",
      authDomain: "lamth-chemistry-teacher-afc1c.firebaseapp.com",
      projectId: "lamth-chemistry-teacher-afc1c",
      storageBucket: "lamth-chemistry-teacher-afc1c.firebasestorage.app",
      messagingSenderId: "617837500859",
      appId: "1:617837500859:web:2acfe8cf4e587745b70c9e"
    };

    const ALLOWED_EMAIL = "ltzihui@gmail.com";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const message = document.getElementById("message");
    const signInButton = document.getElementById("signIn");
    const signOutButton = document.getElementById("signOut");

    signInButton.addEventListener("click", async () => {
      message.textContent = "Opening Google sign-in...";
      try {
        const result = await signInWithPopup(auth, provider);
        if (result.user.email?.toLowerCase() !== ALLOWED_EMAIL) {
          await signOut(auth);
          message.textContent = "Access denied: this Google account is not authorised.";
          return;
        }
        message.textContent =
          "Google sign-in successful. Backend security setup is still pending; no private records are available yet.";
      } catch (error) {
        message.textContent = "Sign-in error: " + error.message;
      }
    });

    signOutButton.addEventListener("click", async () => {
      await signOut(auth);
      message.textContent = "Signed out.";
    });

    onAuthStateChanged(auth, user => {
      signInButton.hidden = !!user;
      signOutButton.hidden = !user;
      if (!user) message.textContent = "Ready to sign in.";
    });
  </script>
</body>
</html>
